name: Deploy achik-chatbot to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Configure AdSense Auto ads
        env:
          ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
        run: |
          if [ -z "$ADSENSE_CLIENT_ID" ]; then
            echo "AdSense is disabled. Set ADSENSE_CLIENT_ID to enable Auto ads."
            exit 0
          fi
          if [[ ! "$ADSENSE_CLIENT_ID" =~ ^ca-pub-[0-9]+$ ]]; then
            echo "::error::ADSENSE_CLIENT_ID must be a valid ca-pub- publisher ID."
            exit 1
          fi
          sed -i "s/__ADSENSE_CLIENT_ID__/${ADSENSE_CLIENT_ID}/g" public/index.html

      - name: Apply D1 Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: d1 migrations apply achik-chatbot-users --remote

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          secrets: |
            GEMINI_API_KEY
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}