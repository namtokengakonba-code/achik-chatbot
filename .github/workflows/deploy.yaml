name: Deploy achik-chatbot to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Google OAuth configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::error::Set GOOGLE_CLIENT_ID as a GitHub Actions secret or repository variable."
            exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Set GOOGLE_CLIENT_SECRET as a GitHub Actions secret."
            exit 1
          fi

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Configure AdSense banner
        env:
          ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
          ADSENSE_SLOT_ID: ${{ vars.ADSENSE_SLOT_ID }}
        run: |
          if [ -z "$ADSENSE_CLIENT_ID" ] && [ -z "$ADSENSE_SLOT_ID" ]; then
            echo "AdSense is disabled. Set ADSENSE_CLIENT_ID and ADSENSE_SLOT_ID repository variables to enable the banner."
            exit 0
          fi
          if [[ ! "$ADSENSE_CLIENT_ID" =~ ^ca-pub-[0-9]+$ ]]; then
            echo "::error::ADSENSE_CLIENT_ID must be a valid ca-pub- publisher ID."
            exit 1
          fi
          if [[ ! "$ADSENSE_SLOT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::ADSENSE_SLOT_ID must contain the numeric AdSense ad-unit ID."
            exit 1
          fi
          sed -i "s/__ADSENSE_CLIENT_ID__/${ADSENSE_CLIENT_ID}/g" public/index.html
          sed -i "s/__ADSENSE_SLOT_ID__/${ADSENSE_SLOT_ID}/g" public/index.html

      - name: Apply D1 Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply achik-chatbot-users --remote
        continue-on-error: true

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            GEMINI_API_KEY
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
